# Paste inside the server { } block for www.filemakr.com (with proxy_pass to Node).
# Reduces intermittent Cloudflare Error 522 when the origin is slow or keep-alive sockets go stale.
#
#   sudo nano /etc/nginx/sites-available/filemakr.com
#   sudo nginx -t && sudo systemctl reload nginx

proxy_connect_timeout 30s;
proxy_send_timeout 120s;
proxy_read_timeout 120s;
send_timeout 120s;

# Reuse upstream connections to Node (less TCP churn).
upstream filemakr_node {
    server 127.0.0.1:3000;
    keepalive 32;
}

# In location / { ... } use:
#   proxy_http_version 1.1;
#   proxy_set_header Connection "";
#   proxy_pass http://filemakr_node;
