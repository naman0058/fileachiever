# Paste inside the server { } block for www.filemakr.com (above location /).
# Required so Node sets Secure session cookies (COOKIE_SECURE=true in .env).
# Without X-Forwarded-Proto, login returns 303 but NO Set-Cookie — user sent back to login page.
#
#   sudo nano /etc/nginx/sites-available/filemakr.com
#   sudo nginx -t && sudo systemctl reload nginx

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Do NOT rewrite Set-Cookie domain unless you know what you are doing:
# proxy_cookie_domain ...
# proxy_cookie_path ...
