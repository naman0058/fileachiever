# Include inside the server { } block for www.filemakr.com (nginx).
# Default nginx client_max_body_size is 1m — that blocks affiliate source-code uploads > 1 MB
# before the request reaches Node.js.
#
# Apply on server:
#   sudo nano /etc/nginx/sites-available/filemakr.com
#   Add the line below inside server { ... } (or in location / { ... })
#   sudo nginx -t && sudo systemctl reload nginx
#
# Also restart Node after deploying app code:
#   pm2 restart all   (or your process name)

client_max_body_size 10M;
